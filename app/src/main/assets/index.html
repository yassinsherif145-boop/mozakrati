const PAL=['#3b82f6','#ef4444','#16a34a','#f59e0b','#8b5cf6','#ec4899','#0d9488','#f97316'];
function load(k){try{const r=localStorage.getItem(k);return r?JSON.parse(r):null}catch(e){return null}}
S=load(K)||S;try{if(window.Android&&Android.loadState){const ns=Android.loadState();if(ns){const o=JSON.parse(ns);if(o&&(o.ts||0)>(S.ts||0))S=o}}}catch(e){}
function norm(){S.subjects=S.subjects||[];S.items=S.items||[];S.log=S.log||{};S.notes=S.notes||{};S.act=S.act||{};S.miss=S.miss||[];S.pp=S.pp||[];S.al=Object.assign({on:true,after:2,hol:'06:00',gap:10,max:4,nq:3,types:['m'],lvl:1,scope:'all',pick:[],cut:20,warn:true,skip:null,hwd:1,exd:4,wn:3,qo:true,late:true,rsn:'06:10'},S.al||{});if(!Array.isArray(S.al.types)||!S.al.types.length)S.al.types=['m'];if(!Array.isArray(S.al.pick))S.al.pick=[];S.al.on=true;if(S.al.types.length>S.al.nq)S.al.types=S.al.types.slice(0,Math.max(1,S.al.nq));S.seen=S.seen||{};S.accu=S.accu||[];S.rsd=S.rsd||{};S.qpool=S.qpool||[];S.updUrl=S.updUrl||'https://raw.githubusercontent.com/yassinsherif145-boop/mozakrati/main/app/src/main/assets/index.html';ttMig();S.items.forEach(i=>{delete i.np;delete i.nd});
 if(!S.tt){S.tt={n:6,c:{}};S.subjects.forEach(s=>{(s.days||[]).forEach(d=>{for(let p=0;p<10;p++){if(!S.tt.c[d+'-'+p]){S.tt.c[d+'-'+p]=s.id;break}}})})}
 const T0=S.tt;T0.n=T0.n||6;T0.times=T0.times||[];T0.title=T0.title||'';T0.hours=T0.hours||'';
 if(!T0.days){const u=[...new Set(Object.keys(T0.c).map(k=>+k.split('-')[0]))];T0.days=u.length?u:[1,2,3,4,6]}
 T0.days=T0.days.slice().sort((a,b)=>ORD.indexOf(a)-ORD.indexOf(b));
 if(!TM&&!S.subjects.length&&!Object.keys(T0.c).length)loadSchool();
 S.subjects.forEach((s,i)=>{if(!s.color)s.color=PAL[i%PAL.length]});syncDays()}
const NOW=()=>FAKE?prs(FAKE):new window.Date();
const save=()=>{S.ts=Date.now();let js='';try{js=JSON.stringify(S);localStorage.setItem(K,js)}catch(e){};try{if(!TM&&window.Android&&Android.saveState)Android.saveState(js)}catch(e){};fsQueue()};
const $=i=>document.getElementById(i);
const mid=d=>{d=new Date(d);d.setHours(0,0,0,0);return d};
const ymd=d=>{d=mid(d);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const prs=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addD=(d,n)=>{const x=mid(d);x.setDate(x.getDate()+n);return x};
const diff=(a,b)=>Math.round((mid(a)-mid(b))/864e5);
const DN=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
let type='hw',subj=null,nd=[],size='s';

function nextClass(s){for(let i=1;i<=14;i++){const d=addD(NOW(),i);if(s.days.includes(d.getDay()))return d}return null}
function lbl(n){return n<0?['فات',Math.abs(n)+' يوم']:n===0?['','']:n===1?['بكرة','']:[n,'أيام']}
function sname(id){const s=S.subjects.find(x=>x.id===id);return s?s.name:''}
let exDate='';
const ICO_CAL='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-4px;margin-inline-end:8px"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>',ICO_BOOK='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-4px;margin-inline-end:8px"><path d="M12 6c-2-1.5-5-2-8-1.5v13c3-.5 6 0 8 1.5 2-1.5 5-2 8-1.5v-13c-3-.5-6 0-8 1.5zM12 6v13"/></svg>';
function pick(){return{sb:type==='hw'?S.subjects.find(x=>x.id===subj):null,t:$('title').value.trim()}}
function dueOf(sb){const dv=exDate;if(dv)return prs(dv);return sb?nextClass(sb):null}
function szUpdate(){const el=$('sz');if(type!=='hw'){el.innerHTML='';return}const{sb}=pick(),d=dueOf(sb),n=d?diff(d,NOW()):0;if(n<2){el.innerHTML='';size='s';return}
 el.innerHTML=`<div class="row"><div class="szb"><button class="ch ${size==='s'?'on':''}" onclick="size='s';szUpdate()">صغير</button></div><div class="szb"><button class="ch ${size==='b'?'on':''}" onclick="size='b';szUpdate()">كبير ++</button><div class="hint">ممكن تقسمه لو عايز · فاضل ${n} يوم</div></div></div>`}
function closeSheet(){const o=$('shOv');if(o)o.remove()}
function subjSheet(){closeSheet();const o=document.createElement('div');o.id='shOv';o.className='ov';o.onclick=e=>{if(e.target===o)closeSheet()};
 const ls=S.subjects.filter(s=>s.days.length);
 o.innerHTML=`<div class="sheet"><div class="shh"><b>اختار المادة</b><button class="ch" onclick="closeSheet()">إغلاق</button></div><div class="sgrid">${ls.map(s=>`<button class="sj2 ${subj===s.id?'on':''}" style="--c:${s.color}" onclick="pickSubj('${s.id}')"><b>${esc(s.alias||s.name)}</b>${s.alias&&s.alias!==s.name?`<small>${esc(s.name)}</small>`:''}</button>`).join('')||'<div class="tg">مفيش مواد</div>'}</div></div>`;
 document.body.appendChild(o)}
function pickSubj(id){subj=id;closeSheet();subjBtn();szUpdate()}
function dateBtn(){const b=$('dtb');if(!b)return;b.innerHTML=ICO_CAL+(exDate?DN[prs(exDate).getDay()]+' '+fd(exDate):'اختار تاريخ الامتحان')}
let dpY=null,dpM=null;
function dateSheet(){closeSheet();const t=mid(NOW()),d=exDate?prs(exDate):t;dpY=d.getFullYear();dpM=d.getMonth();const o=document.createElement('div');o.id='shOv';o.className='ov';o.onclick=e=>{if(e.target===o)closeSheet()};o.innerHTML='<div class="sheet" id="dpS"></div>';document.body.appendChild(o);dpDraw()}
function dpDraw(){const s=$('dpS');if(!s)return;const t=mid(NOW()),off=(new Date(dpY,dpM,1).getDay()+1)%7,dim=new Date(dpY,dpM+1,0).getDate();let c='';for(let i=0;i<off;i++)c+='<span></span>';
 for(let d=1;d<=dim;d++){const k=ymd(new Date(dpY,dpM,d)),past=prs(k)<t;c+=`<button class="dpd${k===exDate?' on':''}${k===ymd(t)?' td':''}" ${past?'disabled':''} onclick="dpPick('${k}')">${AR(d)}</button>`}
 s.innerHTML=`<div class="shh"><button class="ch" onclick="dpNav(-1)">›</button><b>${MN[dpM]} ${AR(dpY)}</b><button class="ch" onclick="dpNav(1)">‹</button></div><div class="cg">${['سبت','أحد','إثنين','ثلاثاء','أربعاء','خميس','جمعة'].map(n=>`<small class="cw">${n}</small>`).join('')}${c}</div>`}
function dpNav(n){dpM+=n;if(dpM<0){dpM=11;dpY--}if(dpM>11){dpM=0;dpY++}dpDraw()}
function dpPick(k){exDate=k;closeSheet();dateBtn();szUpdate()}

function subjBtn(){const s=S.subjects.find(x=>x.id===subj),b=$('sqb');if(!b)return;b.innerHTML=ICO_BOOK+esc(s?(s.alias||s.name):'اختار المادة');b.style.borderColor=s?s.color:''}

function addItem(){
 const{sb,t}=pick();if(!t)return msg('اكتب اسم المهمة');
 const hwd=S.al.hwd||1,exd=S.al.exd||4;
 let due;
 if(type==='exam'){const dv=exDate;if(!dv)return msg('اختار تاريخ الامتحان');due=prs(dv)}
 else{if(!sb)return msg('اختار المادة');due=dueOf(sb);if(!due)return msg('حدد أيام حصص المادة الأول')}
 const n=diff(due,NOW()),big=type==='hw'&&size==='b'&&n>=2,ex=type==='exam';
 const st=ex?ymd(new Date(Math.max(+addD(due,-exd),+mid(NOW())))):null,dd=ex?diff(due,prs(st)):0,k=ex?(dd>=2?Math.min(exd,dd):0):(big?Math.max(1,n-hwd+1):0);
 S.items.push({id:uid(),type,sid:sb?sb.id:null,title:t,due:ymd(due),show:ymd(addD(due,ex?-exd:-hwd)),start:st,created:ymd(NOW()),big,dropped:false,done:null,
  subs:Array.from({length:k},()=>({t:'',d:false,on:null,a:1}))});
 try{const T0=mid(NOW()),nw=new Date(),last=S.items[S.items.length-1];if(!TM&&window.Android&&Android.testRing&&S.al.late!==false&&S.al.skip!==ymd(T0)&&vis(last,T0)&&nw.getHours()*60+nw.getMinutes()>alarmMin(ymd(T0)))Android.testRing(10)}catch(e){}
 size='s';actMark();save();$('title').value='';exDate='';dateBtn();subj=null;subjBtn();msg('');draw();
}
function msg(m){$('msg').textContent=m}
function find(id){return S.items.find(x=>x.id===id)}
function toggle(id){const it=find(id);it.done=it.done?null:ymd(NOW());actMark();save();draw()}
function delItem(id){S.items=S.items.filter(x=>x.id!==id);save();draw()}
function addSub(id,el,soft){const v=el.value.trim();if(!v||el.dataset.busy)return;el.dataset.busy=1;find(id).subs.push({t:v,d:false,on:null});delete DR[el.dataset.dr];actMark();save();if(soft){nativeSync();setTimeout(softDraw,250);return}draw();setTimeout(()=>{const e=document.querySelector('[data-i="'+id+'"]');if(e)e.focus()},0)}
function setSub(id,i,el,soft){const v=el.value.trim();if(!v||el.dataset.busy)return;el.dataset.busy=1;find(id).subs[i].t=v;delete DR[el.dataset.dr];actMark();save();if(soft){nativeSync();setTimeout(softDraw,250)}else draw()}
function chkDone(it){const nm=it.subs.filter(x=>x.t),T0=mid(NOW()),n0=diff(prs(it.due),T0),ok=it.big?(it.subs.length&&it.subs.every(x=>x.t&&x.d)):it.type==='exam'?(nm.length&&nm.every(x=>x.d)&&!it.subs.some((q,k)=>!q.t&&n0>=2&&planned(it,k)>=T0)):(nm.length&&nm.every(x=>x.d));if(ok)it.done=ymd(NOW())}
function togSub(id,i){const it=find(id),s=it.subs[i];s.d=!s.d;s.on=s.d?ymd(NOW()):null;if(s.c&&s.c.length)s.c.forEach(q=>{q.d=s.d;q.on=s.on});chkDone(it);actMark();save();draw()}
function kidSync(it,s){const all=s.c.length>0&&s.c.every(x=>x.d);if(all!==!!s.d){s.d=all;s.on=all?ymd(NOW()):null;chkDone(it)}}
function togK(id,i){const k='k'+id+':'+i;OP[k]=!OP[k];draw()}
function addKid(id,i,el){const v=el.value.trim();if(!v)return;const it=find(id),s=it.subs[i];s.c=s.c||[];s.c.push({t:v,d:false,on:null});if(s.d){s.d=false;s.on=null}OP['k'+id+':'+i]=true;save();draw();setTimeout(()=>{const e=document.querySelector('[data-k="'+id+':'+i+'"]');if(e)e.focus()},0)}
function togKid(id,i,j){const it=find(id),s=it.subs[i],q=s.c[j];q.d=!q.d;q.on=q.d?ymd(NOW()):null;kidSync(it,s);save();draw()}
function delKid(id,i,j){const it=find(id),s=it.subs[i];s.c.splice(j,1);if(s.c.length)kidSync(it,s);save();draw()}
function kidsHtml(it,s,i){const k='k'+it.id+':'+i,open=OP[k]||(s.c&&s.c.length);if(!open)return'';
 return `<div class="kids">${(s.c||[]).map((q,j)=>`<div class="sb ${q.d?'d':''}"><input type="checkbox" ${q.d?'checked':''} onchange="togKid('${it.id}',${i},${j})" aria-label="خلصت"><span>${esc(q.t)}</span><button class="del" onclick="delKid('${it.id}',${i},${j})" aria-label="احذف">×</button></div>`).join('')}<div class="sb"><input type="text" data-k="${it.id}:${i}" placeholder="+ مهمة صغيرة" onkeydown="if(event.key==='Enter')addKid('${it.id}',${i},this)"></div></div>`}
function delSub(id,i){const s=find(id).subs[i];if(s.a){s.t='';s.d=false;s.on=null;s.c=[]}else find(id).subs.splice(i,1);save();draw()}
function addSubj(){const n=$('sn').value.trim();if(!n)return;S.subjects.push({id:uid(),name:n,code:$('sc').value.trim()||n[0],days:nd.slice()});nd=[];$('sn').value='';$('sc').value='';save();draw()}
function setType(k){type=k;if(k==='exam'){size='s'}else{exDate=''}draw()}
function togDay(id,d){const s=S.subjects.find(x=>x.id===id);s.days=s.days.includes(d)?s.days.filter(x=>x!==d):s.days.concat(d);save();draw()}
function expo(){S.lastBackup=ymd(NOW());save();if(window.Android&&Android.saveText){const p=Android.saveText('mozakrati-backup.json',JSON.stringify(S));toast('اتحفظ في: '+p);draw();return}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='mozakrati-backup.json';a.click();draw()}
function impo(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(o.subjects&&o.items){S=o;norm();save();draw();msg('')}}catch(e){msg('الملف مش صالح')}};r.readAsText(f)}
function delSubj(id){S.subjects=S.subjects.filter(x=>x.id!==id);Object.keys(S.tt.c).forEach(k=>{if(S.tt.c[k]===id)delete S.tt.c[k]});if(subj===id)subj=null;save();draw()}

const planned=(it,i)=>{const p=addD(prs(it.type==='hw'&&it.big?it.created:(it.start||it.show)),i),m=addD(prs(it.due),-1);return p>m?m:p};
const acc=it=>{const T=mid(NOW()),cut=(S.al&&S.al.cut)||20;if(it.done||it.m)return 0;if(it.subs.some(s=>s.t))return it.subs.filter((s,i)=>!s.d&&s.t&&isLate(it,i,T)).length;return vis(it,T)&&(prs(it.show)<T||(prs(it.due)>T&&hr()>=cut))?1:0};
const sr=(it,s,i,tg,nodel)=>`<div class="sb ${s.d?'d':''}"><input type="checkbox" ${s.d?'checked':''} onchange="togSub('${it.id}',${i})" aria-label="خلصت"><span class="stx" onclick="editSub('${it.id}',${i})">${esc(s.t)}</span>${tg||''}${nodel?'':`<button class="del" onclick="togK('${it.id}',${i})" aria-label="قسّم">＋</button><button class="del" onclick="delSub('${it.id}',${i})" aria-label="احذف">×</button>`}</div>${nodel?'':kidsHtml(it,s,i)}`;

const pin=(it,i,ph)=>`<div class="sb"><input type="checkbox" onchange="partDone('${it.id}',${i},this)" aria-label="خلصت"><input type="text" data-dr="${it.id}:${i}" placeholder="${ph}" oninput="partIn('${it.id}',${i},this)" onblur="partBlur(event,'${it.id}',${i},this)" onkeydown="if(event.key==='Enter')setSub('${it.id}',${i},this)"></div>`;
function bigSubs(it){return it.subs.map((s,i)=>{const dy=DN[addD(prs(it.created),i).getDay()];return s.t&&s.d?sr(it,s,i,`<span class="tg">${dy}</span>`):s.t?sr(it,s,i,`<span class="tg">${dy}</span>`):pin(it,i,`جزء ${i+1} (${dy})`)}).join('')}
function adderHtml(it){return `<div class="sb"><input type="text" data-i="${it.id}" data-dr="a${it.id}" placeholder="+ جزء إضافي" oninput="drIn(this)" onblur="adderBlur(event,'${it.id}',this)" onkeydown="if(event.key==='Enter')addSub('${it.id}',this)"><button class="del" onclick="addSub('${it.id}',this.previousElementSibling)" aria-label="أضف">＋</button></div>`}
function card(it,far){
 const T=mid(NOW()),n=diff(prs(it.due),T),l=lbl(n),ex=it.type==='exam',st=it.big?' ++':'';
 const l2=(ex&&n===1)?['<span style="font-size:13px">آخر يوم</span>','النهاردة']:l;
 const a=ex?acc(it):0,lv=a>=2?2:a;
 const tag=(ex?'امتحان (verifica)':'واجب (compito)')+(it.sid?' · '+esc(sname(it.sid)):'')+(a?` · متراكم ${a}`:'');
 if(far)return `<div class="it"><div class="bd"><div class="t">${esc(it.title)}${st}</div><div class="tg">${tag} · هيظهر يوم ${DN[shw(it).getDay()]} ${fd(ymd(shw(it)))} · الموعد ${fd(it.due)}</div></div><button class="del" onclick="delItem('${it.id}')" aria-label="احذف">×</button></div>`;
 let subs='';
 let vis=0;if(ex)it.subs.forEach((s,i)=>{const pp=planned(it,i),dy=`<span class="tg">${DN[pp.getDay()]}</span>`;if(!s.t){if(n<2||pp<T)return;vis++;subs+=pin(it,i,`جزء ${vis} (${DN[pp.getDay()]})`);return}const late=!s.d&&isLate(it,i,T);subs+=sr(it,s,i,dy+(late?'<span class="tg" style="color:var(--rd)">متراكم</span>':''))});
 else if(it.big)subs=bigSubs(it);
 else it.subs.forEach((s,i)=>subs+=sr(it,s,i));
 const adder=adderHtml(it);
 const key='t'+it.id;if(OP[key]===undefined)OP[key]=vis>0||(it.big&&it.subs.some(s=>!s.t));
 const tot=it.subs.filter(s=>s.t).length,dn=it.subs.filter(s=>s.t&&s.d).length;
 const rk=riskInfo(it,n);
 return `<details class="tk x${it.done?' dn':''}" style="--c:${rk.c};border-color:${rk.c};border-width:${rk.w}px" data-k="${key}" ${OP[key]?'open':''} ontoggle="OP[this.dataset.k]=this.open"><summary><div class="nn"><b>${l2[0]}</b><span>${l2[1]}</span></div><div class="bd"><div class="t" onclick="event.preventDefault();event.stopPropagation();editItem('${it.id}')">${esc(it.title)}${st}</div><div class="tg">${tag}</div></div><span class="pg">${tot?dn+'/'+tot:'＋'}</span><input type="checkbox" ${it.done?'checked':''} onchange="toggle('${it.id}')" aria-label="خلصت المهمة"><button class="del" onclick="delItem('${it.id}')" aria-label="احذف">×</button></summary><div class="tkb"><div class="subs">${subs}${adder}</div></div></details>`;
}
function extra(it){const key='e'+it.id,n=diff(prs(it.due),mid(NOW())),l=lbl(n);if(OP[key]===undefined)OP[key]=it.subs.some(s=>!s.t);
 const dn=it.subs.filter(s=>s.t&&s.d).length;
 return `<details class="tk${it.done?' dn':''}" data-k="${key}" ${OP[key]?'open':''} ontoggle="OP[this.dataset.k]=this.open"><summary><div class="nn"><b>${l[0]}</b><span>${l[1]}</span></div><div class="bd"><div class="t" onclick="event.preventDefault();event.stopPropagation();editItem('${it.id}')">${esc(it.title)} ++</div><div class="tg">واجب (compito)</div></div><span class="pg">${dn}/${it.subs.length}</span><input type="checkbox" ${it.done?'checked':''} onchange="toggle('${it.id}')" aria-label="خلصت المهمة"><button class="del" onclick="delItem('${it.id}')" aria-label="احذف">×</button></summary><div class="tkb"><div class="subs">${bigSubs(it)}${adderHtml(it)}</div></div></details>`}
function refresh(){
 const T=mid(NOW());let ch=false;
 S.items.forEach(it=>{if(!it.big||it.done||it.dropped)return;
  const last=addD(prs(it.show),-1);
  for(let d=prs(it.created);d<=last&&d<T;d=addD(d,1)){const k=ymd(d);if(!it.subs.some(s=>s.on===k)){it.dropped=true;ch=true;break}}});
 if(ch)save();
}

const WB=document.createElement('div');WB.id='wkBody';$('wkBotBody').appendChild(WB);
let wk=null,mkS=null,yMode='m',dV=false;
const wkStart=d=>addD(d,-((mid(d).getDay()+2)%7));
const FD=['الجمعة','السبت','الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس'];
const MN=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const MS=['ينا','فبر','مار','أبر','ماي','يون','يول','أغس','سبت','أكت','نوف','ديس'];
const scCol=v=>v>=8?'#22c55e':v>=5?'#f59e0b':'#ef4444';
const cls=v=>v===0?'#22c55e':v===1?'#f59e0b':'#ef4444';
const fd=k=>{const d=prs(k);return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getFullYear()%100).padStart(2,'0')};
const wn=k=>{const e=addD(prs(k),6);return Math.ceil((Math.round((e-new Date(e.getFullYear(),0,1))/864e5)+1)/7)};

 h+=`<div style="width:100%;max-width:520px">${ts.length?ts.map(t=>`<div style="background:rgba(255,255,255,.1);border-radius:10px;padding:8px 12px;margin:6px 0"><b>${esc(t.t)}</b>${t.ty==='exam'?` <small>(امتحان · باقي ${t.n} أيام)</small>`:''}${t.parts.length?`<div style="font-size:14px;opacity:.9">${t.parts.map(esc).join('، ')}</div>`:''}</div>`).join(''):'<div>مفيش مهام عليك</div>'}</div>`;
 if(AL.step==='n')h+='<div class="qt">لسه مسجلتش مهام</div><div style="font-size:15px;max-width:420px;text-align:center">سجّل واجباتك وامتحاناتك (وأي حاجة لبكره) دلوقتي. المنبه هيرن تاني لحد ما تسجّل.</div><div class="alb"><button class="alp" onclick="alReg()">سجّل المهام دلوقتي</button></div><button class="ch" style="color:#fff;border-color:#fff" onclick="alNone()">مفيش عندي حاجة النهاردة</button>';
 else if(AL.step==='q'){const q=AL.qs[AL.ok];h+=`<div style="font-size:15px">حل عشان تكمل (${AL.ok+1} من ${AL.qs.length})</div>`;
  if(q.k==='n')h+=`<div style="font-size:15px">اضغط الأرقام بالترتيب من 1 لـ ${q.N}</div><div style="display:grid;grid-template-columns:repeat(4,64px);gap:8px;direction:ltr">${q.order.map(v=>`<button class="go" style="font-size:22px;padding:14px 0;${v<q.nxt?'opacity:.25':''}" onclick="alTap(${v})">${v}</button>`).join('')}</div>`;
  else{if(q.k==='s'&&!q.t0){q.t0=1;q.show=true;setTimeout(()=>{q.show=false;alDraw()},3500)}
   const big=q.k==='s'?(q.show?esc(q.q):'• • • •'):esc(q.q);
   h+=`${q.k==='s'?'<div style="font-size:15px">احفظ الرقم (بيختفي بعد 3 ثواني) وبعدين اكتبه</div>':''}<div style="font-size:30px;font-weight:800;direction:${q.k==='m'||q.k==='s'?'ltr':'rtl'}">${big}${q.k==='m'?' = ؟':''}</div><input id="alIn" type="text" autocomplete="off" ${q.k==='t'?'onpaste="return false" ':''}style="max-width:340px;font-size:22px;text-align:center" onkeydown="if(event.key==='Enter')alCheck()"><button class="go" style="font-size:18px" onclick="alCheck()">تأكيد</button>${q.k==='s'&&!q.show?'<button class="ch" style="color:#fff;border-color:#fff" onclick="alNew()">🔄 فاتني الرقم · رقم جديد</button>':''}<div id="alMsg" style="color:#fca5a5;min-height:22px"></div>`}}
 else if(AL.step==='c')h+='<div class="alb"><button class="alp" onclick="alLater()">⏸ توقيف مؤقت</button><button class="als" onclick="alGo()">ابتديت شغل</button></div>';
 else{const w=AL.wr[AL.wi];h+=`<div style="font-size:15px">اكتب الجملة دي زي ما هي (${AL.wi+1} من ${AL.wr.length})</div><div class="qt">«${esc(w.t)}»${w.a?`<small>— ${esc(w.a)}</small>`:''}</div><input id="alIn" type="text" autocomplete="off" onpaste="return false" oninput="wrAct()" style="width:100%;max-width:420px;font-size:20px;text-align:center" onkeydown="if(event.key==='Enter')wrCheck()"><button class="go" style="font-size:18px" onclick="wrCheck()">تأكيد</button><div id="alMsg" style="color:#fca5a5;min-height:22px"></div>`}
 o.innerHTML=h;const i=$('alIn');if(i&&i.focus)i.focus()}
function alCheck(){const raw=$('alIn').value||'',q=AL.qs[AL.ok];
 const ok=q.k==='t'?nz(raw)===nz(q.a):hin(raw)===hin(q.a);
 if(ok){AL.ok++;if(AL.ok>=AL.qs.length){if(AL.none){alStart();return}AL.step='c'}alDraw()}else{$('alMsg').textContent='غلط، جرّب تاني'}}
function alNew(){const q=AL.qs[AL.ok],d=digs([4,6,8][(S.al.lvl||1)-1]);q.q=d;q.a=d;q.t0=0;q.show=false;alDraw()}
function alGo(){AL.wr=pickQuotes(Math.max(1,S.al.wn||3));AL.wi=0;AL.step='w';wrAct();alDraw()}
function wrAct(){nat('silence',20)}
function wrCheck(){const q=AL.wr[AL.wi],v=nz($('alIn').value||'');
 if(v&&v===nz(q.t)){AL.wi++;if(AL.wi>=AL.wr.length){alStart();return}wrAct();alDraw()}else{$('alMsg').textContent='مش مطابقة، راجع الجملة واكتبها تاني'}}
function warnOk(){closeWarn();nat('closeui')}
function scheduleList(){const out={rings:[],cuts:[],rsn:[]},now=Date.now(),T=mid(NOW());
 for(let d=0;d<10;d++){const day=addD(T,d),dm=alarmMinD(day.getDay());
  if(S.al.skip!==ymd(day)){const r=day.getTime()+dm*60000;if(r>now)out.rings.push(r)}
  const c=day.getTime()+(S.al.cut||20)*3600000;if(c>now)out.cuts.push(c);
  const hm=(S.al.rsn||'06:10').split(':'),rt=day.getTime()+(+hm[0]*60+ +hm[1])*60000;if(rt>now)out.rsn.push(rt)}
 return out}
function nativeSync(){try{if(window.Android&&!TM){if(Android.setTasks)Android.setTasks(JSON.stringify(notifPayload()));if(Android.setSchedule)Android.setSchedule(JSON.stringify(scheduleList()))}}catch(e){}}

 const list=S.items.filter(i=>!i.m&&vis(i,T)&&(!i.done||i.done===ty)).sort((a,b)=>diff(prs(a.due),prs(b.due))||(a.type==='exam'?-1:1));
 const pend=list.filter(i=>!i.done&&i.np!=='d'),dn=list.length-pend.length,tot=list.length;
 const lg=logToday(pend,dn,T,ty),sc=tot?Math.round(dn/tot*100)/10:0;

 else h+='<div class="ok">مفيش حاجة النهاردة</div>';
 $('today').innerHTML=h;
 const exs=S.items.filter(i=>i.big&&!i.done&&!i.m&&prs(i.show)>T&&i.subs.filter(s=>!s.d).length>=2);
 $('exl').innerHTML=exs.length?`${exs.map(extra).join('')}`:'';
 const far=S.items.filter(i=>!i.done&&!i.m&&!vis(i,T)).sort((a,b)=>diff(shw(a),shw(b)));
 $('up').innerHTML=far.map(i=>card(i,true)).join('')||'<div class="tg">فاضي</div>';
 $('upl').textContent='القادم ('+far.length+')';
 $('types').innerHTML=[['hw','واجب (compito)'],['exam','امتحان (verifica)']].map(([k,v])=>`<button class="ch ${type===k?'on':''}" onclick="setType('${k}')">${v}</button>`).join('');
 $('bk').innerHTML='';
 $('tm').innerHTML=TM?`<div style="background:#7c3aed;color:#fff;border-radius:10px;padding:8px 12px;margin:8px 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap"><b>🧪 وضع التجربة</b><span>التاريخ:</span><input type="date" value="${FAKE}" onchange="fakeSet(this.value)" style="flex:none"><button class="ch" style="background:#fff;color:#4c1d95" onclick="fakeNext()">+ يوم</button><button class="ch" style="background:#fff;color:#4c1d95" onclick="exitTest()">خروج</button></div>`:'';
 $('sqb').hidden=type!=='hw';$('dtb').hidden=type!=='exam';dateBtn();subjBtn();
 if(!TM&&S.al.on&&S.al.warn!==false&&hr()>=S.al.cut&&S.wd!==ty&&examsWeek().some(i=>acc(i)>0)){S.wd=ty;save();showWarn()}
 szUpdate();calRender();place();wkRender();moRender();yrRender();alInfo();lsPop();nativeSync();drRestore();pendCheck();
}
