<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مذاكرتي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#eef2f4;--sf:#fff;--tx:#14212b;--mu:#5d6c78;--ac:#1b4f72;--rd:#c0392b;--gn:#2e7d4f;--ln:#d5dde2;--yl:#b58900}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10181e;--sf:#18242c;--tx:#e8eef2;--mu:#93a4b0;--ac:#6db3e0;--rd:#ef7b6c;--gn:#65c28b;--ln:#2a3a45;--yl:#e3b341}}
:root[data-theme="dark"]{--bg:#10181e;--sf:#18242c;--tx:#e8eef2;--mu:#93a4b0;--ac:#6db3e0;--rd:#ef7b6c;--gn:#65c28b;--ln:#2a3a45;--yl:#e3b341}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 Cairo,"Segoe UI",Tahoma,sans-serif}
main{max-width:680px;margin:0 auto;padding:16px}
h1{font-size:26px;margin:8px 0 2px;font-weight:800}
h2{font-size:17px;margin:22px 0 8px;font-weight:600}
.sub{color:var(--mu);margin:0 0 14px}
.bar{height:8px;background:var(--ln);border-radius:4px;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:var(--gn);transition:width .3s}
.add{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:12px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
button,input{font:inherit;color:inherit}
.ch{border:1px solid var(--ln);background:transparent;border-radius:20px;padding:3px 12px;cursor:pointer}
.ch.on{background:var(--ac);color:var(--bg);border-color:var(--ac)}
input[type=text],input[type=date]{border:1px solid var(--ln);background:var(--bg);border-radius:6px;padding:7px 10px;flex:1;min-width:0}
.go{background:var(--ac);color:var(--bg);border:0;border-radius:6px;padding:7px 18px;cursor:pointer;font-weight:600}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.hw{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--mu);border-radius:8px;padding:10px 12px;margin:8px 0}
.xm{display:flex;gap:14px;align-items:flex-start;border:5px solid var(--c);border-radius:14px;padding:16px;margin:14px 0}
.xm .t{font-size:21px;font-weight:800}.xm .n b{font-size:44px;color:var(--c)}
.c0{--c:var(--gn)}.c1{--c:var(--yl)}.c2{--c:var(--rd)}
.exl{border:2.5px solid var(--mu);border-radius:8px;padding:8px 10px;margin:10px 0;font-size:14px}
.exl .t{font-size:15px}
.it{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--ln);align-items:flex-start}
.n{min-width:62px;text-align:center;line-height:1.2}
.n b{display:block;font-size:30px;font-weight:800}
.n span{font-size:12px;color:var(--mu)}
.bd{flex:1;min-width:0}
.t{font-weight:600}
.tg{font-size:13px;color:var(--mu)}
.sb{display:flex;gap:8px;align-items:center;margin:2px 0}
.sb.d span{text-decoration:line-through;color:var(--mu)}
.sb input[type=text]{padding:3px 8px;font-size:14px}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--gn);flex:none}
.del{background:none;border:0;color:var(--mu);cursor:pointer;font-size:18px}
.ok{text-align:center;padding:26px 8px;color:var(--gn);font-weight:600;font-size:18px}
.msg{color:var(--rd);min-height:22px;font-size:14px}
details{margin-top:18px}summary{cursor:pointer;color:var(--ac);font-weight:600}
.sj{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--ln)}
.wkh{background:linear-gradient(135deg,#7c3aed,#ec4899 60%,#f59e0b);color:#fff;border-radius:16px;padding:14px 16px;margin:8px 0}
.wkh h2{margin:0;font-size:22px}.wkh p{margin:2px 0 0;font-size:15px}
.wc{background:var(--sf);border:2px solid var(--ln);border-radius:16px;padding:12px 14px;margin:12px 0}
.wc h3{margin:0 0 4px;font-size:16px}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.pill{border-radius:14px;padding:6px 12px;cursor:pointer;background:transparent;font-weight:600;line-height:1.3;text-align:center}
.pill small{display:block;font-weight:400;font-size:12px}
.pill.on{box-shadow:0 0 0 3px var(--c);}
.ringw{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.big{font-size:40px;font-weight:800;line-height:1}
.stc{display:inline-block;margin:2px 10px 2px 0;font-size:13px}
.stc i{color:#fbbf24;font-style:normal;text-shadow:0 0 6px #fbbf2488;letter-spacing:2px;font-size:17px}
.chip{display:inline-block;background:#ef444422;border:1.5px solid #ef4444;border-radius:12px;padding:2px 10px;margin:3px 4px 3px 0;font-size:14px}
.nb{border:2px solid var(--c);border-radius:14px;overflow:hidden;margin:12px 0}
.nh{background:var(--c);color:#fff;padding:6px 14px;font-weight:800}
.nb textarea{width:100%;border:0;background:var(--sf);color:var(--tx);padding:10px 12px;font:inherit;resize:vertical;min-height:96px;display:block}
.tm{font-weight:800;font-size:17px;margin:4px 0}
.dn .t{text-decoration:line-through;text-decoration-thickness:2px;color:var(--rd)}
.scr{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
details.dd{margin:6px 0;border:1.5px solid var(--ln);border-radius:10px;padding:6px 10px}
.wc>summary{font-weight:800;font-size:16px}
.sc10{display:inline-block;font-family:Caveat,"Segoe Script","Bradley Hand",cursive;color:var(--rd);font-size:28px;font-weight:700;line-height:1;transform:rotate(-4deg);position:relative;padding:0 6px;unicode-bidi:isolate}
.sc10::after{content:"";position:absolute;left:0;right:0;bottom:-5px;height:5px;border-bottom:3px solid var(--rd);border-radius:50%;transform:rotate(-1.5deg)}
.xl{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0}
.xl th{background:var(--ac);color:var(--bg);padding:6px 8px;text-align:right;font-weight:600}
.xl td{border:1px solid var(--ln);padding:5px 8px}
.xl tr:nth-child(even) td{background:var(--bg)}
.tb{border:2px solid var(--c);border-radius:12px;padding:8px 12px;background:var(--sf)}
.tb.r{--c:#ef4444}.tb.o{--c:#f59e0b}
.tb>summary{font-weight:800;display:flex;justify-content:space-between;align-items:center}
.cnt{background:var(--c);color:#fff;border-radius:10px;padding:0 10px;min-width:26px;text-align:center}
.gr{display:grid;grid-template-columns:1.1fr 1fr 1fr .8fr .9fr .7fr;gap:4px;padding:8px 10px;align-items:center;font-size:14px}
.gh{background:var(--ac);color:var(--bg);font-weight:600;border-radius:8px 8px 0 0}
details.wr{margin:0;border:1px solid var(--ln);border-top:0;background:var(--sf)}
.wr>summary{cursor:pointer;list-style:none;font-weight:600}
.wr>summary::-webkit-details-marker{display:none}
.ar::before{content:'◀ ';font-size:11px}
.wr[open]>summary .ar::before{content:'▼ '}
.wb{padding:10px 12px;border-top:1px dashed var(--ln)}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:10px 0}
.dbox{border:2px solid var(--ln);border-radius:10px;padding:8px;min-height:120px;cursor:pointer;background:var(--sf);position:relative;font-size:13px;line-height:1.6}
.dbox:hover,.dbox:focus-visible{border-color:var(--ac)}
.dh{display:flex;flex-direction:column;border-bottom:1px solid var(--ln);margin-bottom:4px}
.dh small{color:var(--mu)}
.dn2{text-decoration:line-through;text-decoration-color:var(--rd);text-decoration-thickness:2px}
.dsc{position:absolute;left:8px;top:6px;font-size:18px}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;max-width:600px}
.cw{text-align:center;color:var(--mu);font-size:14px;font-weight:600}
.cd{aspect-ratio:1.05;display:flex;align-items:center;justify-content:center;border-radius:10px;background:var(--ln);color:var(--mu);font-weight:700;font-size:22px}
.cd.on{background:#22c55e;color:#fff}
.cd.fu{background:transparent;border:2px dashed var(--ln)}
.cd.td{outline:3px solid var(--ac)}
.tt td{height:46px;min-width:84px;cursor:pointer;padding:3px}
.tb2{border-radius:8px;color:#fff;padding:5px 7px;font-size:13px;font-weight:700;cursor:grab}
.tb2 .x{margin-right:8px;cursor:pointer;opacity:.85}
.tt2{border-collapse:collapse;table-layout:fixed;width:100%;min-width:760px;font-size:11px;direction:ltr}
.tt2 th,.tt2 td{border:1px solid #444;padding:3px;text-align:left;vertical-align:top;height:46px}
.tt2 .tl{background:#31a8c6;color:#000;text-align:center;width:92px}
.tt2 .ph,.tt2 .dh2{background:#76923c;color:#000;font-weight:700;cursor:pointer}
.tt2 td{background:#e9e9e9;color:#000;cursor:pointer}
.tt2 td.blk{background:#000}
.tt2 small{display:block;font-weight:400;font-size:10px}
.tt2 .tb2{background:none;color:#000;font-weight:400;font-size:11px;padding:2px;border-radius:0;cursor:grab}
.tt2 .x{margin-right:6px;color:#b91c1c;cursor:pointer;font-weight:700}
input::placeholder{color:var(--mu);opacity:1}
.exl{max-width:250px;border:2px solid var(--mu);border-radius:10px;padding:6px 8px;font-size:12px}
.exl .t{font-size:13px;font-weight:600}
.exl .sb{margin:1px 0;gap:6px}
.exl input[type=text]{padding:2px 8px;font-size:12px}
.exl input[type=checkbox]{width:16px;height:16px}
.hw{padding:6px 10px;margin:6px 0;gap:10px}
.xm{border-width:3px;border-radius:10px;padding:8px 10px;margin:8px 0;gap:10px}
.xm .t{font-size:16px}
.n{min-width:46px}
.n b,.xm .n b{font-size:24px}
.n span{font-size:11px}
.t{font-size:15px}
.tg{font-size:12px}
.bd .sb{margin:1px 0}
.bd .sb input[type=text]{padding:2px 8px;font-size:12px;min-height:0}
.subs{display:flex;flex-wrap:wrap;gap:4px 6px;margin-top:3px}
.subs .sb{margin:0;display:inline-flex;border:1px solid var(--ln);border-radius:8px;padding:1px 6px;background:var(--bg)}
.subs .sb:has(input[type=text]){border:0;padding:0;background:none}
.subs .sb input[type=text]{width:88px;flex:none;padding:2px 8px;font-size:12px}
.subs .sb span{font-size:13px}
.sb.d span{text-decoration:line-through;text-decoration-color:var(--rd);text-decoration-thickness:2px;color:var(--rd)}
.hw,.xm{position:relative}
.dn.hw,.dn.xm{background:rgba(34,197,94,.09)}
.dn .t{text-decoration:none;color:var(--tx);opacity:.7}
.stamp{position:absolute;left:78px;top:50%;transform:translateY(-50%) rotate(-8deg);border:2px solid var(--rd);color:var(--rd);border-radius:8px;padding:0 10px;font-weight:800;font-size:16px;background:var(--sf)}
.tbw{flex:1;min-width:180px;display:flex;flex-direction:column;gap:10px}
.tbw:has(details[open]){flex:1 1 100%}
.xl td{word-break:break-word}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:8px;align-items:start}
.cgrid .hw,.cgrid .xm{margin:0}
.subs{flex-direction:column;flex-wrap:nowrap;gap:3px}
.subs .sb{display:flex;width:100%}
.subs .sb input[type=text]{width:100%;flex:1}
.stamp{top:auto;bottom:6px;left:62px;transform:rotate(-8deg);font-size:14px}
.nt{border-style:dashed;background:rgba(124,58,237,.06)}
.ntl{font-size:11px;font-weight:800;color:#7c3aed;margin-bottom:2px}
.nt.ndn{opacity:.45;filter:grayscale(1)}
.kids{margin-right:18px;display:flex;flex-direction:column;gap:2px}
.kids .sb{border:0;background:none;padding:0}
.kids .sb span{font-size:12px}
.kids .sb input[type=text]{font-size:11px;padding:1px 6px}
.lsn{border:2px solid #8b5cf6;border-radius:14px;background:rgba(139,92,246,.09);padding:12px 16px;margin:10px 0 14px}
.lsh{font-weight:800;color:#7c3aed;font-size:17px;margin-bottom:6px}
.lsh small{font-weight:400;color:var(--mu);margin-right:10px;font-size:12px}
.lst{white-space:pre-wrap;font-size:16px;line-height:1.9}
.subs .sb{border-right:3px solid #3b82f6;background:rgba(59,130,246,.07)}
.subs .sb:has(input[type=text]){border-right:0;background:none}
.kids{margin-right:14px;padding:3px 6px 3px 2px;border-right:3px solid #a855f7;background:rgba(168,85,247,.12);border-radius:8px}
.kids .sb{border:0!important;background:none!important}
.kids .sb span::before{content:'↳ ';color:#a855f7;font-weight:800}
.kids .sb span{font-size:12px}
</style></head><body><main>
<h1>مذاكرتي</h1>
<div style="display:flex;justify-content:space-between;align-items:center"><p class="sub" id="dt"></p><div class="row" style="margin:0"><button class="ch" onclick="setOpen()">⚙</button><button class="ch" onclick="ttOpen()">الجدول</button></div></div>
<div id="tm"></div>
<div id="bk"></div>

<div id="stack" style="display:flex;flex-direction:column"><div id="wkTop"></div>
<details id="tabA" hidden open><summary>📋 قايمة اليوم والإضافية</summary><div id="tabAb"></div></details>
<details id="tabB" hidden><summary>➕ إضافة شيء، المواد، القادم</summary><div id="tabBb"></div></details>
<div id="slotA"><div id="blockA"><div id="today"></div><div id="exl"></div></div></div>
<div id="slotB"><div id="blockB">

<div class="add">
 <div class="row" id="types"></div>
 <div class="row"><input type="text" id="title" placeholder="المهمة" oninput="szUpdate()" onkeydown="if(event.key==='Enter')addItem()"><input type="text" id="sq" list="sl" placeholder="🔍 المادة" oninput="subjIn();szUpdate()" style="max-width:150px"><datalist id="sl"></datalist></div><div id="sz"></div>
 <div class="row"><input type="date" id="date" aria-label="التاريخ" onchange="szUpdate()"><button class="go" onclick="addItem()">سجّل</button></div>
 <div class="msg" id="msg"></div>
</div>



<details><summary id="upl">القادم</summary><div id="up"></div></details>
</div></div>
<details id="wkBot"><summary>السجل الأسبوعي</summary><div id="wkBotBody"></div></details>
<details id="moBot"><summary>السجل الشهري</summary><div id="moBody"></div></details>
<details id="yrBot"><summary>السجل السنوي</summary><div id="yrBody"></div></details>
<div id="calBlock" hidden></div>
<div id="calBtnW" style="display:flex;justify-content:flex-end;margin:24px 0 8px"><button class="ch" id="calBtn" onclick="calV=!calV;draw()">التقويم</button></div>
</div>
</main>
<script>
let K='study_v1',TM=false,FAKE=null,FH=null,fsSt='off',fsT=null;let S={subjects:[],items:[]};
const PAL=['#3b82f6','#ef4444','#16a34a','#f59e0b','#8b5cf6','#ec4899','#0d9488','#f97316'];
function load(k){try{const r=localStorage.getItem(k);return r?JSON.parse(r):null}catch(e){return null}}
S=load(K)||S;
function norm(){S.subjects=S.subjects||[];S.items=S.items||[];S.log=S.log||{};S.notes=S.notes||{};S.act=S.act||{};S.miss=S.miss||[];S.pp=S.pp||[];S.al=Object.assign({on:true,after:2,hol:'06:00',gap:10,max:4,nq:3,types:['m'],lvl:1,scope:'all',pick:[],cut:20,warn:true},S.al||{});if(!Array.isArray(S.al.types)||!S.al.types.length)S.al.types=['m'];if(!Array.isArray(S.al.pick))S.al.pick=[];S.items.forEach(i=>{delete i.np;delete i.nd});
 if(!S.tt){S.tt={n:6,c:{}};S.subjects.forEach(s=>{(s.days||[]).forEach(d=>{for(let p=0;p<10;p++){if(!S.tt.c[d+'-'+p]){S.tt.c[d+'-'+p]=s.id;break}}})})}
 const T0=S.tt;T0.n=T0.n||6;T0.times=T0.times||[];T0.title=T0.title||'';T0.hours=T0.hours||'';
 if(!T0.days){const u=[...new Set(Object.keys(T0.c).map(k=>+k.split('-')[0]))];T0.days=u.length?u:[1,2,3,4,6]}
 T0.days=T0.days.slice().sort((a,b)=>ORD.indexOf(a)-ORD.indexOf(b));
 if(!TM&&!S.subjects.length&&!Object.keys(T0.c).length)loadSchool();
 S.subjects.forEach((s,i)=>{if(!s.color)s.color=PAL[i%PAL.length]});syncDays()}
const NOW=()=>FAKE?prs(FAKE):new window.Date();
const save=()=>{S.ts=Date.now();try{localStorage.setItem(K,JSON.stringify(S))}catch(e){};fsQueue()};
const $=i=>document.getElementById(i);
const mid=d=>{d=new Date(d);d.setHours(0,0,0,0);return d};
const ymd=d=>{d=mid(d);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const prs=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addD=(d,n)=>{const x=mid(d);x.setDate(x.getDate()+n);return x};
const diff=(a,b)=>Math.round((mid(a)-mid(b))/864e5);
const DN=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
let type='hw',subj=null,nd=[],size='s';

function nextClass(s){for(let i=1;i<=14;i++){const d=addD(NOW(),i);if(s.days.includes(d.getDay()))return d}return null}
function lbl(n){return n<0?['فات',Math.abs(n)+' يوم']:n===0?['','']:n===1?['بكرة','']:[n,'أيام']}
function sname(id){const s=S.subjects.find(x=>x.id===id);return s?s.name:''}
function pick(){subjIn();return{sb:S.subjects.find(x=>x.id===subj),t:$('title').value.trim()}}
function dueOf(sb){const dv=$('date').value;if(dv)return prs(dv);return sb?nextClass(sb):null}
function szUpdate(){const el=$('sz');if(type!=='hw'){el.innerHTML='';return}const{sb}=pick(),d=dueOf(sb),n=d?diff(d,NOW()):0;if(n<2){el.innerHTML='';size='s';return}
 el.innerHTML=`<div class="tg">باقي ${n} أيام</div><div class="row"><button class="ch ${size==='s'?'on':''}" onclick="size='s';szUpdate()">صغير</button><button class="ch ${size==='b'?'on':''}" onclick="size='b';szUpdate()">كبير ++</button></div>`}

function addItem(){
 const{sb,t}=pick();if(!t)return msg('اكتب اسم المهمة');
 let due;
 if(type==='exam'){const dv=$('date').value;if(!dv)return msg('اختار تاريخ الامتحان');due=prs(dv)}
 else{if(!sb&&!$('date').value)return msg('اختار المادة');due=dueOf(sb);if(!due)return msg('حدد أيام حصص المادة الأول')}
 const n=diff(due,NOW()),big=type==='hw'&&size==='b'&&n>=2,ex=type==='exam';
 const st=ex?ymd(new Date(Math.max(+addD(due,-4),+mid(NOW())))):null,dd=ex?diff(due,prs(st)):0,k=ex?(dd>=2?Math.min(4,dd):0):(big?n:0);
 S.items.push({id:uid(),type,sid:sb?sb.id:null,title:t,due:ymd(due),show:ymd(addD(due,ex?-4:-1)),start:st,created:ymd(NOW()),big,dropped:false,done:null,
  subs:Array.from({length:k},()=>({t:'',d:false,on:null,a:1}))});
 size='s';actMark();save();$('title').value='';$('date').value='';$('sq').value='';subj=null;msg('');draw();
}
function msg(m){$('msg').textContent=m}
function find(id){return S.items.find(x=>x.id===id)}
function toggle(id){const it=find(id);it.done=it.done?null:ymd(NOW());actMark();save();draw()}
function delItem(id){S.items=S.items.filter(x=>x.id!==id);save();draw()}
function addSub(id,el){const v=el.value.trim();if(!v)return;find(id).subs.push({t:v,d:false,on:null});actMark();save();draw();setTimeout(()=>{const e=document.querySelector('[data-i="'+id+'"]');if(e)e.focus()},0)}
