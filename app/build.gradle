plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mzk.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.mzk.app'
        minSdk 26
        targetSdk 33
        versionCode 100 + ((System.getenv('GITHUB_RUN_NUMBER') ?: '0') as Integer)
        versionName '1.2'
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.12.0'
}
