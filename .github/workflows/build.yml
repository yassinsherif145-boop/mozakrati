name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: mozakrati-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish release (for in-app update)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk mozakrati.apk
          gh release create "build-${{ github.run_number }}" mozakrati.apk --title "build ${{ github.run_number }}" --notes "auto build" --latest
